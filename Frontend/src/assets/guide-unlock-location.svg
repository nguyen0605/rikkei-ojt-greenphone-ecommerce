<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <defs>
    <filter id="unlock-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="arrow-shadow-2" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="380" rx="16" fill="#f1f5f9" />

  <!-- Browser address bar -->
  <g transform="translate(25, 18)">
    <rect width="490" height="38" rx="8" fill="#1e293b" />
    <!-- Lock icon with Red Box -->
    <rect x="8" y="5" width="28" height="28" rx="6" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2" />
    <g transform="translate(16, 11)">
      <rect x="0" y="4" width="12" height="10" rx="2" fill="#38bdf8" />
      <path d="M3 4V2.5a3 3 0 0 1 6 0V4" stroke="#38bdf8" stroke-width="1.6" fill="none" />
      <circle cx="6" cy="9" r="1.2" fill="#1e293b" />
    </g>
    <text x="44" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      greenphone.duckdns.org/thanh-toan
    </text>
  </g>

  <!-- Chrome Lock Dropdown Menu (Dark) -->
  <g transform="translate(25, 68)" filter="url(#unlock-shadow)">
    <rect width="350" height="280" rx="14" fill="#202124" stroke="#3c4043" stroke-width="1.2" />

    <!-- Site title in menu -->
    <text x="20" y="32" fill="#e8eaed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      greenphone.duckdns.org
    </text>

    <!-- Row: Kết nối an toàn -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" fill="#9aa0a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Kết nối này an toàn
      </text>
    </g>

    <!-- Row: Vị trí (Location) - Highlighted with Red Box -->
    <rect x="15" y="80" width="320" height="60" rx="10" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="3" />
    
    <g transform="translate(26, 92)">
      <path d="M8 1.5C4.96 1.5 2.5 3.96 2.5 7c0 4.2 5.5 8.5 5.5 8.5s5.5-4.3 5.5-8.5c0-3.04-2.46-5.5-5.5-5.5zm0 7.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="#8ab4f8" />
      <text x="22" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        Vị trí (Location)
      </text>
      <!-- Toggle ON pill -->
      <g transform="translate(230, 2)">
        <rect width="46" height="24" rx="12" fill="#16a34a" />
        <circle cx="34" cy="12" r="9" fill="#ffffff" />
      </g>
      <text x="22" y="30" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
        Gạt sang BẬT (ON)
      </text>
    </g>

    <!-- Reset permission button - Highlighted with Red Box -->
    <rect x="15" y="152" width="320" height="48" rx="10" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="2.5" />
    <g transform="translate(26, 162)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#2d3748" stroke="#4a5568" stroke-width="1" />
      <text x="80" y="18" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
        Đặt lại quyền
      </text>
      <text x="175" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        (Reset permission)
      </text>
    </g>

    <!-- Other items -->
    <g transform="translate(20, 222)">
      <text x="0" y="14" fill="#9aa0a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Cookie và dữ liệu trang web
      </text>
    </g>
    <g transform="translate(20, 252)">
      <text x="0" y="14" fill="#9aa0a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Cài đặt trang web
      </text>
    </g>
  </g>

  <!-- RED ARROW POINTING TO TOGGLE & RESET -->
  <g filter="url(#arrow-shadow-2)">
    <path d="M345 160 L385 145 L465 220 L440 242 L364 170 L346 185 Z" fill="#dc2626" />
    <polygon points="330,158 372,130 360,180" fill="#ef4444" />
  </g>

  <!-- Red Action Callout Tag -->
  <g transform="translate(378, 170)" filter="url(#arrow-shadow-2)">
    <rect width="144" height="48" rx="10" fill="#dc2626" />
    <text x="72" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold">
      BẤM VÀO ĐÂY
    </text>
    <text x="72" y="38" text-anchor="middle" fill="#fee2e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">
      Gạt Bật / Đặt lại quyền
    </text>
  </g>
</svg>
