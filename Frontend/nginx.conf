# ==============================================================================
# GreenPhone Frontend — Nginx Production Configuration
# Domain: greenphone.duckdns.org
# Features: HTTP->HTTPS Redirect, SSL TLSv1.2/1.3, Gzip, Security Headers, SPA Proxy
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server — Port 80 (Certbot ACME Challenge & HTTPS Redirection)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name greenphone.duckdns.org 103.77.208.221 localhost;

    # Certbot ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Port 443 (Production SSL, Security Headers, Gzip, SPA)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name greenphone.duckdns.org;

    # SSL Certificate & Private Key (Issued by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/greenphone.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenphone.duckdns.org/privkey.pem;

    # Modern SSL/TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Security Headers (OWASP Recommended)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Allow image uploads up to 10MB
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static asset caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
