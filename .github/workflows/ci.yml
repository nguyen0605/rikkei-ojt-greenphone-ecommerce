name: GreenPhone CI — Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GreenPhone-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -x test
      - run: ./gradlew test --tests "com.re.greenphone.service.*" --tests "com.re.greenphone.security.*"
      - run: ./gradlew jacocoTestReport
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: GreenPhone-Backend/build/reports/jacoco/test/html/

  frontend-build-test:
    name: Frontend — Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npm run lint
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/

  security-scan:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: cd Frontend && npm ci && npm audit --audit-level=high

  release-gate:
    name: Release Gate
    needs: [backend-build-test, frontend-build-test, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Gate
        run: |
          echo "Checking release gate..."
          if [[ "${{ needs.backend-build-test.result }}" == "success" ]] &&
             [[ "${{ needs.frontend-build-test.result }}" == "success" ]] &&
             [[ "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "✅ RELEASE GATE: PASS"
          else
            echo "❌ RELEASE GATE: FAIL"
            exit 1
          fi
