name: GreenPhone CI — Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GreenPhone-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build without tests
        run: ./gradlew build -x test
      - name: Run Backend Unit Tests
        run: ./gradlew test --tests "com.re.greenphone.service.*" --tests "com.re.greenphone.security.*"
      - name: Generate Jacoco Test Report
        run: ./gradlew jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: GreenPhone-Backend/build/reports/jacoco/test/html/

  frontend-build-test:
    name: Frontend — Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc -b
      - name: Vite production build
        run: npm run build
      - name: ESLint check (non-blocking)
        run: npm run lint || true
      - name: Run Frontend Unit Tests
        run: npx vitest run || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: Frontend/dist/

  security-scan:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Dependency audit check
        run: cd Frontend && npm audit --audit-level=critical || true

  release-gate:
    name: Release Gate
    needs: [backend-build-test, frontend-build-test, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Gate
        run: |
          echo "Checking release gate..."
          if [[ "${{ needs.backend-build-test.result }}" == "success" ]] &&
             [[ "${{ needs.frontend-build-test.result }}" == "success" ]] &&
             [[ "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "RELEASE GATE: PASS"
          else
            echo "RELEASE GATE: FAIL"
            exit 1
          fi
